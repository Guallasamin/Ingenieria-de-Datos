# =====================================================================
# Taller Individual - Semana 1 | Ingenieria de Datos
# Infraestructura ETL + Data Warehouse (100% contenerizada)
# ---------------------------------------------------------------------
#   postgres  -> FUENTE 1 (schema staging) + DESTINO DW (schema dw)
#   mysql     -> FUENTE 2 (catalogos maestros / dimensiones de negocio)
#   adminer   -> consola web para inspeccionar ambos motores
#   metabase  -> capa OLAP / visualizacion del cubo (perfil "bi")
#   etl       -> runtime Python de respaldo y de carga inicial
# ---------------------------------------------------------------------
# Perfil "elk" (Taller Semana 2) -> docker compose --profile elk up -d
#   elasticsearch -> motor de indexacion y busqueda (destino analitico)
#   logstash      -> 5 pipelines: 3 batch (JDBC/CSV) + 2 near real-time
#   kibana        -> exploracion y tableros
#   filebeat      -> agente de cola (tail) del flujo de transacciones
# =====================================================================
name: taller-etl-dw

services:

  postgres:
    image: postgres:16-alpine
    container_name: etl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_pass_2026
      POSTGRES_DB: banca_ec
      TZ: America/Guayaquil
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d banca_ec"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.0
    container_name: etl_mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --local-infile=1
      # Ajuste de memoria: libera ~300 MB para el stack ELK (ver informe).
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_2026
      MYSQL_DATABASE: catalogos_sb
      MYSQL_USER: etl_user
      MYSQL_PASSWORD: etl_pass_2026
      TZ: America/Guayaquil
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uetl_user -petl_pass_2026 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  adminer:
    image: adminer:4-standalone
    container_name: etl_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy

  etl:
    image: python:3.11-slim
    container_name: etl_runtime
    working_dir: /proyecto
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: banca_ec
      PG_USER: etl_user
      PG_PASS: etl_pass_2026
      MY_HOST: mysql
      MY_PORT: "3306"
      MY_DB: catalogos_sb
      MY_USER: etl_user
      MY_PASS: etl_pass_2026
      PYTHONUNBUFFERED: "1"
    volumes:
      - ..:/proyecto
      - pipcache:/root/.cache/pip
      # Canal near real-time: volumen compartido con Filebeat. No se usa un
      # bind mount del anfitrion porque en macOS cada escritura con vaciado
      # inmediato cuesta milisegundos y frena al generador.
      - nrtlogs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    # El script va como UN solo elemento de lista: si se pasa como cadena,
    # compose la divide en argumentos y "bash -lc" solo ejecutaria el primero.
    command:
      - |
        set -e
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
          libffi8 fonts-dejavu-core poppler-utils > /dev/null
        pip install --quiet --no-input pandas openpyxl SQLAlchemy \
          psycopg2-binary PyMySQL cryptography weasyprint
        echo ">> Runtime ETL listo (pandas, SQLAlchemy, WeasyPrint)."
        tail -f /dev/null

  # ===================================================================
  # STACK ELK - perfil "elk"
  # ===================================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elk_elasticsearch
    profiles: ["elk"]
    restart: unless-stopped
    environment:
      node.name: banca-es01
      cluster.name: banca-ec
      discovery.type: single-node
      # Entorno academico de un solo nodo: sin TLS ni autenticacion.
      # NO apto para produccion (se justifica en el informe).
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.ml.enabled: "false"
      # Heap acotado: el equipo solo dispone de 3,8 GiB para Docker.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
      TZ: America/Guayaquil
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    mem_limit: 1400m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 40

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: elk_logstash
    profiles: ["elk"]
    restart: unless-stopped
    environment:
      # 384 MB de heap: con 256 MB, Logstash pasaba la carga batch al 89 %
      # de su limite y la recoleccion de basura frenaba la ingesta.
      LS_JAVA_OPTS: "-Xms384m -Xmx384m"
      # Credenciales inyectadas: no se escriben en los .conf del pipeline.
      PG_USER: etl_user
      PG_PASS: etl_pass_2026
      MY_USER: etl_user
      MY_PASS: etl_pass_2026
      TZ: America/Guayaquil
    mem_limit: 1024m
    ports:
      - "5044:5044"   # entrada beats (near real-time)
      - "9600:9600"   # API de monitoreo de Logstash
    volumes:
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./elk/logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/drivers:/usr/share/logstash/drivers:ro
      - ./elk/logstash/diccionario:/usr/share/logstash/diccionario:ro
      - ../fuentes:/fuentes:ro
      - lsdata:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: elk_kibana
    profiles: ["elk"]
    restart: unless-stopped
    environment:
      SERVER_NAME: kibana
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: "--max-old-space-size=448"
      TZ: America/Guayaquil
    mem_limit: 800m
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: elk_filebeat
    profiles: ["elk"]
    restart: unless-stopped
    user: root
    # strict.perms=false: el fichero montado desde macOS no cumple la
    # comprobacion de permisos que exige Filebeat por defecto.
    command: ["filebeat", "-e", "--strict.perms=false"]
    environment:
      TZ: America/Guayaquil
    mem_limit: 150m
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - nrtlogs:/logs:ro
      - fbdata:/usr/share/filebeat/data
    depends_on:
      - logstash

  # Perfil opcional: docker compose --profile bi up -d
  metabase:
    image: metabase/metabase:latest
    container_name: etl_metabase
    profiles: ["bi"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: banca_ec
      MB_DB_PORT: 5432
      MB_DB_USER: etl_user
      MB_DB_PASS: etl_pass_2026
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mysqldata:
  pipcache:
  esdata:
  lsdata:
  fbdata:
  nrtlogs:
