# =====================================================================
# N1 - NEAR REAL-TIME (push) | Filebeat -> "banca-transacciones"
# ---------------------------------------------------------------------
# Canal de eventos transaccionales. El simulador escribe una linea NDJSON
# por operacion; Filebeat sigue el fichero (tail) y empuja el evento a
# Logstash por el puerto 5044. Latencia esperada: 1-3 segundos.
#
# Enriquecimiento en vuelo: cada transaccion se cruza contra el catalogo
# de entidades que cargo el flujo BATCH B2. Es el punto donde ambos
# esquemas -batch y near real-time- se encuentran.
# =====================================================================

input {
  beats {
    port => 5044
  }
}

filter {
  # Filebeat entrega la linea cruda en [message]; aqui se abre el JSON.
  json {
    source => "message"
    skip_on_invalid_json => true
    target => "tx"
  }

  if ![tx][id_tx] {
    # Linea corrupta o incompleta: se aparta en lugar de romper el flujo.
    mutate { add_tag => ["_json_invalido"] }
  } else {
    mutate {
      rename => {
        "[tx][id_tx]"       => "id_tx"
        "[tx][ts]"          => "ts_origen"
        "[tx][cod_entidad]" => "cod_entidad"
        "[tx][entidad]"     => "entidad"
        "[tx][canal]"       => "canal"
        "[tx][tipo]"        => "tipo_transaccion"
        "[tx][provincia]"   => "provincia"
        "[tx][canton]"      => "canton"
        "[tx][monto]"       => "monto"
        "[tx][moneda]"      => "moneda"
        "[tx][estado]"      => "estado"
        "[tx][id_cliente]"  => "id_cliente"
      }
      convert => { "monto" => "float" }
    }

    # La marca temporal la fija el ORIGEN, no la hora de ingesta: asi la
    # latencia del pipeline no distorsiona la serie temporal.
    date {
      match  => ["ts_origen", "ISO8601"]
      target => "@timestamp"
    }

    # Latencia extremo a extremo, medida dentro del propio evento.
    ruby {
      code => "event.set('latencia_ingesta_ms',
                 ((Time.now.to_f - event.get('@timestamp').to_f) * 1000).round)"
    }

    # Enriquecimiento con la dimension de entidades, en MEMORIA.
    #
    # La primera version usaba el filtro "elasticsearch" para consultar el
    # indice del catalogo una vez por evento. Funcionaba, pero cada evento
    # costaba un viaje HTTP: el pipeline no sostenia 20 eventos por segundo,
    # la cola crecia sin limite y la latencia p99 alcanzo 313 segundos.
    # Una dimension de 25 filas se resuelve con una busqueda en un mapa.
    #
    # El diccionario lo materializa elk/01b_diccionario_entidades.py desde
    # el mismo catalogo de MySQL que alimenta el flujo batch B2, de modo que
    # ambos carriles siguen compartiendo una unica fuente de verdad.
    translate {
      source           => "cod_entidad"
      target           => "clasificacion"
      dictionary_path  => "/usr/share/logstash/diccionario/entidades.yml"
      refresh_interval => 300
      # El filtro translate NO admite "tag_on_failure": la ausencia se
      # cubre con "fallback", y la etiqueta se pone despues comprobando
      # el valor resultante.
      fallback         => "NO_DEFINIDO|NO_DEFINIDO"
    }
    mutate { split => { "clasificacion" => "|" } }
    mutate {
      add_field => {
        "grupo_tamanio"  => "%{[clasificacion][0]}"
        "perfil_negocio" => "%{[clasificacion][1]}"
      }
      remove_field => ["clasificacion"]
    }
    if [grupo_tamanio] == "NO_DEFINIDO" {
      mutate { add_tag => ["sin_catalogo"] }
    }

    # Reglas de negocio evaluadas al vuelo (deteccion en linea).
    # Umbral fijado en USD 3.000: por encima de esa cifra queda el 5 % de
    # las operaciones del generador, proporcion util para una alerta.
    if [monto] and [monto] >= 3000 {
      mutate { add_field => { "alerta" => "MONTO_ALTO" } }
    }
    if [estado] == "RECHAZADA" {
      mutate { add_tag => ["rechazada"] }
    }
  }

  mutate {
    add_field    => { "[@metadata][modo]" => "near_real_time" }
    # "event" incluye event.original, que es una copia integra del JSON de
    # entrada: duplicaba el tamanio del indice sin aportar informacion.
    remove_field => ["message", "tx", "@version", "agent", "ecs",
                     "input", "log", "host", "event"]
  }
  mutate {
    remove_tag => ["beats_input_codec_plain_applied"]
  }
}

output {
  elasticsearch {
    hosts  => ["http://elasticsearch:9200"]
    index  => "banca-transacciones"
    # Flujo de datos (data stream): exige op_type=create y habilita el
    # ciclo de vida ILM con rollover automatico.
    action      => "create"
    data_stream => "false"
  }
}
