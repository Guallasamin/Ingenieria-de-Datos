# =====================================================================
# N2 - NEAR REAL-TIME (pull) | PostgreSQL incremental -> "banca-bitacora"
# ---------------------------------------------------------------------
# Sondeo incremental de la bitacora del ETL cada 15 segundos. A
# diferencia de N1, aqui NADIE empuja el dato: Logstash pregunta.
#
# La marca de agua es id_ejecucion (secuencia autoincremental). Logstash
# guarda el ultimo valor leido en disco, de modo que tras un reinicio
# retoma donde se quedo y no reprocesa la tabla entera.
#
# Es el canal de OBSERVABILIDAD del propio pipeline: permite vigilar en
# Kibana las cargas del ETL, sus rechazos y su duracion.
# =====================================================================

input {
  jdbc {
    jdbc_driver_library    => "/usr/share/logstash/drivers/postgresql.jar"
    jdbc_driver_class      => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/banca_ec"
    jdbc_user     => "${PG_USER}"
    jdbc_password => "${PG_PASS}"

    # Sondeo cada 15 s. El formato de 6 campos anade los segundos al
    # cron habitual de 5 campos.
    schedule => "*/15 * * * * *"

    # --- marca de agua incremental ---
    use_column_value       => true
    tracking_column        => "id_ejecucion"
    tracking_column_type   => "numeric"
    record_last_run        => true
    last_run_metadata_path => "/usr/share/logstash/data/.bitacora_last_run"
    clean_run              => false

    statement => "
      SELECT id_ejecucion, proceso, fuente, objeto_destino,
             filas_leidas, filas_escritas, filas_rechazadas,
             estado, mensaje,
             inicio::text AS inicio_txt,
             fin::text    AS fin_txt,
             EXTRACT(EPOCH FROM (fin - inicio)) AS duracion_seg
      FROM staging.etl_bitacora
      WHERE id_ejecucion > :sql_last_value
      ORDER BY id_ejecucion"
  }
}

filter {
  date {
    match    => ["inicio_txt", "yyyy-MM-dd HH:mm:ss.SSSSSS", "yyyy-MM-dd HH:mm:ss"]
    timezone => "America/Guayaquil"
    target   => "@timestamp"
  }

  mutate {
    convert => { "duracion_seg" => "float" }
    add_field    => { "[@metadata][modo]" => "near_real_time" }
    remove_field => ["@version", "event", "inicio_txt", "fin_txt"]
  }

  # Semaforo de salud de la carga, calculado en la ingesta.
  if [estado] != "OK" {
    mutate { add_field => { "salud" => "ERROR" } }
  } else if [filas_rechazadas] and [filas_rechazadas] > 0 {
    mutate { add_field => { "salud" => "CON_RECHAZOS" } }
  } else {
    mutate { add_field => { "salud" => "OK" } }
  }
}

output {
  elasticsearch {
    hosts       => ["http://elasticsearch:9200"]
    index       => "banca-bitacora-etl"
    document_id => "%{id_ejecucion}"
  }
}
