# =====================================================================
# B1 - BATCH | PostgreSQL (Data Warehouse) -> indice "banca-hechos"
# ---------------------------------------------------------------------
# Carga masiva de la tabla de hechos desnormalizada contra sus seis
# dimensiones: 176.990 documentos. Es el nucleo analitico del indice.
# Modo: batch de carga completa; se ejecuta una vez al arrancar.
# =====================================================================

input {
  jdbc {
    jdbc_driver_library    => "/usr/share/logstash/drivers/postgresql.jar"
    jdbc_driver_class      => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/banca_ec"
    jdbc_user     => "${PG_USER}"
    jdbc_password => "${PG_PASS}"

    # Paginacion: sin ella el driver traeria las 176.990 filas a memoria
    # de una sola vez y Logstash (256 MB de heap) se quedaria sin espacio.
    jdbc_paging_enabled => true
    jdbc_page_size      => 20000
    jdbc_fetch_size     => 5000

    # La fecha se extrae TAMBIEN como texto (fecha_txt). El driver JDBC
    # devuelve DATE en la zona del servidor y Logstash lo reinterpreta en
    # UTC, lo que desplazaria los cortes de fin de mes al dia anterior.
    statement => "
      SELECT h.saldo_sk,
             t.fecha::text          AS fecha_txt,
             t.anio, t.semestre, t.trimestre, t.mes,
             t.nombre_mes, t.anio_mes, t.etiqueta_trim,
             e.cod_entidad, e.nombre_comercial AS entidad,
             e.estado_entidad, e.grupo_tamanio, e.perfil_negocio,
             g.region, g.provincia, g.canton, g.nivel_bancarizacion,
             p.nombre_producto, p.familia, p.subfamilia, p.cuenta_contable,
             o.nombre_operacion, o.naturaleza,
             f.cod_fuente, f.tipo_tecnologia,
             h.saldo_total, h.saldo_por_vencer, h.saldo_no_devenga,
             h.saldo_vencido, h.saldo_improductivo,
             h.numero_cuentas, h.numero_clientes
      FROM dw.fact_saldos_financieros h
      JOIN dw.dim_tiempo         t ON t.tiempo_sk         = h.tiempo_sk
      JOIN dw.dim_entidad        e ON e.entidad_sk        = h.entidad_sk
      JOIN dw.dim_geografia      g ON g.geografia_sk      = h.geografia_sk
      JOIN dw.dim_producto       p ON p.producto_sk       = h.producto_sk
      JOIN dw.dim_tipo_operacion o ON o.tipo_operacion_sk = h.tipo_operacion_sk
      JOIN dw.dim_fuente_datos   f ON f.fuente_sk         = h.fuente_sk"
  }
}

filter {
  # El corte mensual es la marca temporal del documento.
  date {
    match    => ["fecha_txt", "yyyy-MM-dd"]
    timezone => "America/Guayaquil"
    target   => "@timestamp"
  }
  mutate {
    add_field => { "[@metadata][modo]" => "batch" }
    remove_field => ["fecha_txt", "@version", "event"]
  }
  # Los NUMERIC llegan como BigDecimal; se fuerzan a float para que
  # Elasticsearch pueda agregarlos (sum, avg, percentiles).
  mutate {
    convert => {
      "saldo_total"        => "float"
      "saldo_por_vencer"   => "float"
      "saldo_no_devenga"   => "float"
      "saldo_vencido"      => "float"
      "saldo_improductivo" => "float"
    }
  }
  # Indicador de negocio calculado en el momento de la ingesta.
  if [naturaleza] == "ACTIVO" and [saldo_total] and [saldo_total] > 0 {
    ruby {
      code => "event.set('indice_morosidad',
                 (event.get('saldo_improductivo').to_f /
                  event.get('saldo_total').to_f * 100).round(4))"
    }
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    index    => "banca-hechos"
    # Clave subrogada como _id: reejecutar el batch sobrescribe en vez
    # de duplicar. Sin esto, Logstash (entrega "al menos una vez")
    # generaria 176.990 documentos nuevos en cada corrida.
    document_id => "%{saldo_sk}"
    action      => "index"
  }
}
