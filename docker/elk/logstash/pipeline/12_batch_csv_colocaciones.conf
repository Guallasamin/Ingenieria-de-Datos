# =====================================================================
# B3 - BATCH | CSV plano -> indice "banca-colocaciones-2026"
# ---------------------------------------------------------------------
# Lee el fichero delimitado por ";" que produce el ETL de la semana 1.
# Modo "read": procesa el fichero completo y termina (a diferencia de
# "tail", que es el modo que se usa para el flujo near real-time).
# =====================================================================

input {
  file {
    path             => "/fuentes/csv/colocaciones_2026.csv"
    mode             => "read"
    start_position   => "beginning"
    # sincedb en /dev/null: en cada arranque el fichero se reprocesa
    # entero. Es lo que se espera de una carga batch reproducible; la
    # idempotencia la garantiza el document_id calculado mas abajo.
    sincedb_path     => "/dev/null"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/csv_procesados.log"
  }
}

filter {
  csv {
    separator => ";"
    skip_header => true
    columns => ["fecha_corte","entidad","provincia","canton","segmento",
                "por_vencer","no_devenga_intereses","vencida",
                "total_saldo","archivo_origen"]
  }

  date {
    match    => ["fecha_corte", "yyyy-MM-dd"]
    timezone => "America/Guayaquil"
    target   => "@timestamp"
  }

  mutate {
    convert => {
      "por_vencer"           => "float"
      "no_devenga_intereses" => "float"
      "vencida"              => "float"
      "total_saldo"          => "float"
    }
    add_field => { "[@metadata][modo]" => "batch" }
    remove_field => ["message", "@version", "event", "log", "host"]
  }

  # Misma limpieza que aplica el flujo de KNIME: la razon social del
  # regulador trae espacios dobles y sufijos de estado.
  mutate { gsub => ["entidad", "\s+", " "] strip => ["entidad","provincia","canton"] }

  # Huella determinista: reejecutar el batch sobrescribe el mismo
  # documento en lugar de duplicarlo.
  #
  # La huella cubre TAMBIEN las medidas, no solo la clave de negocio. En
  # el fichero del regulador hay 10 pares de filas que comparten
  # (fecha, entidad, provincia, canton, segmento) con importes distintos
  # -por ejemplo USD 1,00 frente a USD 4.614 millones en Quito-, asi que
  # esa clave aparente no identifica la fila. Con una huella corta, la
  # segunda fila sobrescribia a la primera y se perdian 10 registros.
  fingerprint {
    source => ["fecha_corte","entidad","provincia","canton","segmento",
               "por_vencer","no_devenga_intereses","vencida","total_saldo"]
    target => "[@metadata][huella]"
    method => "SHA256"
    concatenate_sources => true
  }
}

output {
  elasticsearch {
    hosts       => ["http://elasticsearch:9200"]
    index       => "banca-colocaciones-2026"
    document_id => "%{[@metadata][huella]}"
  }
}
