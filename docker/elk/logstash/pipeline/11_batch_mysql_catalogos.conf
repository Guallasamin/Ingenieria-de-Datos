# =====================================================================
# B2 - BATCH | MySQL (catalogos maestros) -> "banca-catalogo-*"
# ---------------------------------------------------------------------
# Dos entradas JDBC en un mismo pipeline, discriminadas por [tipo] y
# enrutadas a indices distintos en la salida. Los catalogos son
# dimensiones puras: alimentan filtros y busquedas en Kibana.
# =====================================================================

input {
  jdbc {
    jdbc_driver_library    => "/usr/share/logstash/drivers/mysql-connector-j.jar"
    jdbc_driver_class      => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://mysql:3306/catalogos_sb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guayaquil"
    jdbc_user     => "${MY_USER}"
    jdbc_password => "${MY_PASS}"
    type => "entidad"
    statement => "
      SELECT entidad_sk, cod_entidad, version, nombre_entidad,
             nombre_comercial, estado_entidad, grupo_tamanio,
             perfil_negocio, cobertura_geo,
             num_provincias, num_cantones,
             IF(es_vigente = 1, 'true', 'false') AS vigente,
             CAST(fecha_inicio_vig AS CHAR) AS vig_desde,
             CAST(fecha_fin_vig    AS CHAR) AS vig_hasta
      FROM cat_entidad_financiera"
  }

  jdbc {
    jdbc_driver_library    => "/usr/share/logstash/drivers/mysql-connector-j.jar"
    jdbc_driver_class      => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://mysql:3306/catalogos_sb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guayaquil"
    jdbc_user     => "${MY_USER}"
    jdbc_password => "${MY_PASS}"
    type => "geografia"
    statement => "
      SELECT geografia_sk, cod_geografia, canton, provincia, region,
             nivel_bancarizacion, num_entidades_presentes,
             es_canton_principal, es_registro_desconocido
      FROM cat_geografia"
  }
}

filter {
  mutate { remove_field => ["@version", "event"] }

  # El indicador de vigencia se resuelve en la CONSULTA, no aqui. El
  # controlador de MySQL mapea TINYINT(1) a Boolean (tinyInt1isBit), de modo
  # que comparar el campo con el entero 1 dentro de Logstash falla siempre y
  # en silencio: las 26 entidades quedaban marcadas como no vigentes y la
  # busqueda de enriquecimiento del canal en vivo no encontraba ninguna.
  if [type] == "entidad" {
    mutate { convert => { "vigente" => "boolean" } }
  }
}

output {
  if [type] == "entidad" {
    elasticsearch {
      hosts       => ["http://elasticsearch:9200"]
      index       => "banca-catalogo-entidad"
      # Clave compuesta: una entidad tiene varias versiones SCD-2.
      document_id => "%{cod_entidad}-v%{version}"
    }
  } else {
    elasticsearch {
      hosts       => ["http://elasticsearch:9200"]
      index       => "banca-catalogo-geografia"
      document_id => "%{cod_geografia}"
    }
  }
}
